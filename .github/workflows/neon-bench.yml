name: NEON benchmarks (Apple Silicon)

on:
  push:
    branches: [pref/neon-macos-bench]
  workflow_dispatch:

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: CPU
        run: |
          uname -m
          sysctl -n machdep.cpu.brand_string
          sysctl -n hw.ncpu hw.memsize
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
      - name: Benchmark
        run: bash bench/run.sh 2>&1 | tee bench-${{ matrix.os }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.os }}
          path: bench-${{ matrix.os }}.txt
